name: dbt_ferrovias
version: "1.0.0"
profile: dbt_ferrovias

# unaccent normaliza os nomes de estação antes de casar com os pátios.
on-run-start:
  - "create extension if not exists unaccent"

models:
  dbt_ferrovias:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  dbt_ferrovias:
    +schema: seeds
    mercadorias:
      +column_types:
        perigosa: boolean
    estacoes_manuais:
      +column_types:
        estacao: text
        uf: text
        lat: double precision
        lon: double precision
        fonte: text
    produtos_exportacao:
      +column_types:
        sh4: text
    portos:
      +column_types:
        urf: text
        lat: double precision
        lon: double precision
        raio_km: double precision
    ufs_comex:
      +column_types:
        uf: text
