version: 2

models:
  - name: int_producao__deduplicada
    description: Produção sem as repetições idênticas que a ANTT publicou.
  - name: int_estacoes__geolocalizadas
    description: Cada estação do SIADE com a coordenada do pátio correspondente, quando ele existe.
    columns:
      - name: estacao_id
        tests: [unique, not_null]
  - name: int_trilho__chegadas_porto
    description: Fluxos ferroviários que terminam numa estação dentro do raio de um porto, nas mercadorias de exportação.
  - name: int_acidentes__deduplicados
    description: Acidentes sem os registros repetidos do arquivo de 2004 a 2020.
    columns:
      - name: acidente_id
        tests: [unique, not_null]
  - name: int_acidentes__geolocalizados
    description: Cada acidente com o ponto do pátio da estação anterior ou posterior.
    columns:
      - name: acidente_id
        tests: [unique, not_null]

  - name: int_estacoes__km_linha_jf
    description: >
      Estações da Linha do Centro em Juiz de Fora com o km oficial deduzido dos
      acidentes (meio da janela entre o último acidente antes e o primeiro
      depois) e a posição do pátio sobre o traçado do OSM. São as âncoras que
      ligam o km ao mapa.
    columns:
      - name: estacao
        tests: [unique, not_null]
  - name: int_acidentes__na_linha_jf
    description: Acidentes da MRS na Linha do Centro em Juiz de Fora postos sobre o traçado pelo km, entre duas estações de referência.
    columns:
      - name: acidente_id
        tests: [unique, not_null]
  - name: int_trechos_jf
    description: Trechos de 1 km do km oficial em Juiz de Fora, desenhados sobre o traçado com a mesma interpolação dos acidentes (macro km_no_tracado_jf).
    columns:
      - name: trecho_km
        tests: [unique, not_null]
