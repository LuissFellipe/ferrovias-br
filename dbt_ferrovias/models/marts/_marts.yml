version: 2

models:
  - name: dim_estacoes
    description: Estações que aparecem no SIADE, com coordenada quando o pátio foi encontrado.
    columns:
      - name: estacao_id
        tests: [unique, not_null]

  - name: dim_ferrovias
    description: Concessionárias (seed ferrovias.csv). O SIADE só traz a sigla.
    columns:
      - name: ferrovia
        tests: [unique, not_null]

  - name: dim_mercadorias
    description: Mercadoria da ANTT e o grupo usado nas análises (seed mercadorias.csv).
    columns:
      - name: mercadoria_antt
        tests: [unique, not_null]

  - name: fct_producao_mensal
    description: Um fluxo por mês, ferrovia, mercadoria, origem e destino.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [mes, ferrovia, mercadoria_antt, origem_id, destino_id]
    columns:
      - name: ferrovia
        description: Concessionária responsável pelo fluxo, segundo o dicionário da ANTT. Um fluxo pode passar pela malha de outra.
        tests:
          - relationships: {to: ref('dim_ferrovias'), field: ferrovia}
      - name: grupo
        description: >
          Nulo quando a ANTT publica uma mercadoria que não está no seed. O
          teste para o pipeline até ela ser classificada.
        tests: [not_null]

  - name: fct_ferrovia_grupo_mensal
    description: Toneladas por mês, ferrovia e grupo de mercadoria.

  - name: fct_fluxos_anuais
    description: Fluxos somados por ano; é o que o mapa desenha.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ano, ferrovia, mercadoria_antt, origem_id, destino_id]

  - name: fct_porto_produto_mensal
    description: Exportação por porto, produto e mês contra o que chegou de trem ao porto.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [mes, porto, produto]
    columns:
      - name: fora_do_trilho_t
        description: Exportado menos o que chegou de trem. Negativo num mês quando a carga do trem ficou estocada para embarcar no mês seguinte.

  - name: fct_porto_produto_uf_anual
    description: A mesma conta por estado e ano, aproximada (UF de produção no Comex Stat, UF da estação de embarque no SIADE).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ano, porto, produto, uf]

  - name: fct_acidentes
    description: Um acidente ferroviário por linha (RAAF/ANTT, 2004 em diante), sem dado pessoal.
    columns:
      - name: acidente_id
        tests: [unique, not_null]
      - name: registro_completo
        description: >
          Falso antes de 2011. Até 2009 todo acidente do arquivo é grave e o
          país inteiro soma um óbito em seis anos, com 130 a 190
          atropelamentos por ano: os não graves e as mortes não eram
          registrados. Contagem antes de 2011 não se compara com depois.
      - name: taxonomia_causa
        description: Período da classificação de causas. Não compare causa entre os dois.

  - name: fct_acidentes_ferrovia_anual
    description: Acidentes, graves, óbitos e acidentes por bilhão de TKU, por ferrovia e ano, com o índice oficial da ANTT ao lado.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ferrovia, ano]
    columns:
      - name: acidentes_por_bilhao_tku
        description: Métrica deste projeto, não da ANTT. Nula quando a ferrovia não declarou carga no ano.
      - name: indice_oficial
        description: Acidentes por milhão de trem·km publicado pela ANTT. Nulo depois de 2019, porque o arquivo até 2025 saiu vazio.

  - name: fct_acidentes_na_linha_jf
    description: >
      Acidentes da MRS em Juiz de Fora (Linha do Centro) com o ponto no traçado
      do OSM, interpolado pelo km entre as estações de referência. Junta com
      fct_acidentes por acidente_id.
    columns:
      - name: acidente_id
        tests:
          - unique
          - not_null
          - relationships: {to: ref('fct_acidentes'), field: acidente_id}
      - name: vao_entre_ancoras_km
        description: Distância entre as duas estações de referência que cercam o acidente. Quanto maior, maior o erro de posição (30 m com 6 km; 1,2 km com 24 km).
