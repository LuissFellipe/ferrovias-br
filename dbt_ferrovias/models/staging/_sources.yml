version: 2

sources:
  - name: antt
    schema: raw
    tables:
      - name: producao
        description: SIADE, produção origem-destino. Uma linha do CSV da ANTT por registro, com o texto como veio.
      - name: arquivos_carregados
        description: Cada CSV anual e a data de modificação dele no CKAN da ANTT.
      - name: acidentes
        description: RAAF, um acidente por linha, com o texto como veio. Sem a coluna Equipagem (nome do maquinista), que a ingestão descarta.
      - name: acidentes_arquivos
        description: O arquivo vigente de cada série de acidentes, o período que o nome dele declara e o formato de data detectado na carga.
      - name: indice_acidentes
        description: Índice oficial de acidentes por milhão de trem·km, por concessionária e ano.
      - name: indice_acidentes_arquivos
        description: Cada arquivo do índice e o último ano que o nome dele promete.
  - name: infrasa
    schema: raw
    tables:
      - name: patios
        description: Pátios ferroviários declarados pelas concessionárias à ANTT, publicados pela InfraSA.
  - name: comex
    schema: raw
    tables:
      - name: comex_exportacao
        description: Exportação mensal em kg por UF do produto, URF de despacho e posição SH4 (API do Comex Stat).
  - name: osm
    schema: raw
    tables:
      - name: osm_jf
        description: >
          Linha principal da MRS em Juiz de Fora, as ruas e caminhos que a tocam
          e os nós de passagem em nível, de uma cópia fixa do OpenStreetMap
          (© colaboradores do OpenStreetMap, ODbL).
      - name: osm_jf_copia
        description: O arquivo da cópia do OSM que está carregado.
  - name: exposicao
    schema: raw
    tables:
      - name: setores_jf
        description: Setores censitários de Juiz de Fora com o total de pessoas (IBGE, Censo 2022, malha com atributos, v0001).
      - name: escolas_jf
        description: Escolas em funcionamento em Juiz de Fora (INEP, Censo Escolar 2023, geocodificadas pelo IPEA no geobr).
      - name: enderecos_jf
        description: >
          Endereços não residenciais de Juiz de Fora no CNEFE 2022 (IBGE): ensino,
          saúde, comércio e serviço, religioso. Só a espécie e a coordenada.
