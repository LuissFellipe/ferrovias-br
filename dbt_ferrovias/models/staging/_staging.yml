version: 2

models:
  - name: stg_antt__producao
    description: Produção origem-destino tipada. Cada linha é uma mercadoria transportada de uma estação a outra num mês.
    columns:
      - name: mes
        description: Primeiro dia do mês de referência.
        tests: [not_null]
      - name: tu
        description: Toneladas úteis, o peso da carga sem o vagão.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0}
      - name: tku
        description: Toneladas úteis vezes os quilômetros percorridos.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0}
      - name: uf_origem
        tests: [not_null]
      - name: uf_destino
        tests: [not_null]

  - name: stg_infrasa__patios
    description: Pátios com coordenada em WGS84 e o nome normalizado para casar com o SIADE.
    columns:
      - name: patio_id
        tests: [unique, not_null]

  - name: stg_comex__exportacao
    description: Exportação mensal em toneladas, com a UF do produto em sigla.
    columns:
      - name: uf_nome
        description: Nome que o Comex Stat usa. Um nome novo que não esteja em ufs_comex para o pipeline.
        tests:
          - relationships: {to: ref('ufs_comex'), field: nome}
      - name: toneladas
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0}

  - name: stg_antt__acidentes
    description: Acidentes ferroviários tipados, com a data corrigida e a natureza dos dois layouts na mesma lista.
    columns:
      - name: acidente_id
        tests: [unique, not_null]
      - name: data_ocorrencia
        tests: [not_null]
      - name: ferrovia
        tests:
          - relationships: {to: ref('ferrovias'), field: sigla}
      - name: natureza
        description: Natureza básica. Uma natureza nova na ANTT para o pipeline até entrar nesta lista.
        tests:
          - accepted_values:
              values: [Descarrilamento, Atropelamento, Abalroamento, Colisão, Incêndio, Explosão, Não informada]
      - name: causa_direta
        description: >
          A classificação mudou em dezembro de 2020: "Casos fortuitos ou de
          força maior" cai de 30% para 3% dos acidentes e "Interferência de
          terceiro" sobe de 21% para 74%. Comparar causa entre os dois
          períodos mede a troca de classificação, não a ferrovia.
        tests:
          - accepted_values:
              values:
                - Interferência de Terceiro
                - Via Permanente
                - Casos Fortuitos ou de Força Maior
                - Material Rodante
                - Falha Humana
                - Outras Causas
                - Atos de vandalismo
                - Sinalização, Telecomunicações e Eletrotécnica
                - Infraestrutura
                - Gestão
                - Sistemas
                - Não informada
      - name: obitos
        tests: [not_null, dbt_utils.accepted_range: {min_value: 0}]
      - name: feridos
        tests: [not_null, dbt_utils.accepted_range: {min_value: 0}]

  - name: stg_antt__indice_acidentes
    description: Índice oficial de acidentes por milhão de trem·km. O dado aberto vai até 2019.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ferrovia, ano]

  - name: stg_osm__linha_jf
    description: Linha principal da MRS entre Matias Barbosa e Ewbank da Câmara, em metros (EPSG 31983), começando no sul.
  - name: stg_osm__travessias_jf
    description: Passagens em nível e cruzamentos de rua com a linha principal, pela distância em metros desde o começo do traçado.
