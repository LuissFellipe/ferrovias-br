services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ferrovias
      POSTGRES_PASSWORD: ferrovias
      POSTGRES_DB: ferrovias
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferrovias"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
